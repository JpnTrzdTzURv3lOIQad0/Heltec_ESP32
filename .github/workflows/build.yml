name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Heltec board package (provides HELTEC_BOARD, RADIO_CHIP_* and pin macros).
  HELTEC_CORE_VERSION: 3.3.8
  HELTEC_INDEX_URL: https://resource.heltec.cn/download/package_heltec_esp32_index.json

jobs:
  # Builds only run when the lint workflow passes.
  lint:
    uses: ./.github/workflows/lint.yml

  build:
    name: Build examples (${{ matrix.chip }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per chip that has a prebuilt liblorawan.a in src/ and a
        # board in the Heltec core. esp32c6 is left out because Heltec 3.3.8
        # has no heltec_rcc6 board.
        include:
          - chip: esp32
            fqbn: Heltec-esp32:esp32:heltec_wifi_lora_32_V2
          - chip: esp32s3
            fqbn: Heltec-esp32:esp32:heltec_wifi_lora_32_V3
          - chip: esp32c3
            fqbn: Heltec-esp32:esp32:heltec_wireless_mini_shell
    steps:
      - uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Heltec ESP32 Arduino core
        run: |
          arduino-cli config set board_manager.additional_urls "$HELTEC_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install "Heltec-esp32:esp32@${HELTEC_CORE_VERSION}"

      - name: Install library dependencies
        run: arduino-cli lib install "Adafruit GFX Library" "Adafruit BusIO"

      # Sketches are compiled against this checkout via --library.
      # Add examples here only if they build with the core and library alone.
      - name: Compile examples
        env:
          FQBN: ${{ matrix.fqbn }}
          CHIP: ${{ matrix.chip }}
        run: |
          set -euo pipefail
          for sketch in \
            examples/ESP32/GetChipID \
            examples/LoRaBasic/LoRaSender \
            examples/LoRaBasic/LoRaReceiver \
            examples/2.4G_RF/WiFi_Test; do
            name=$(basename "$sketch")
            arduino-cli compile \
              --fqbn "$FQBN" \
              --library . \
              --output-dir "build/$CHIP/$name" \
              "$sketch"
          done

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.chip }}
          path: build/${{ matrix.chip }}/
          if-no-files-found: error

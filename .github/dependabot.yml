version: 2
updates:
  # Keeps the GitHub Actions used in .github/workflows up to date.
  # Arduino library dependencies (library.json / library.properties) are not
  # a Dependabot-supported ecosystem, so they are not covered here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
